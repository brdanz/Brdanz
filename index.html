<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BXF TOLS SHOP</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/glass.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-page">

<div class="bg-grid"></div>
<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>

<!-- BANNER TOP -->
<div class="banner-top">
   <img src="https://files.catbox.moe/6euzu7.png" alt="BXF Banner">
</div>

<!-- LOGIN CARD -->
<div class="login-wrap">
   <div class="glass login-card">
      <div class="logo-login">
         <i class="fa-solid fa-crown"></i>
         <h1>BXF TOLS SHOP</h1>
         <p>Digital Solution For Your Needs</p>
      </div>

      <form id="loginForm" autocomplete="off">
         <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="username" placeholder="Username" required>
         </div>
         <div class="input-group">
            <i class="fa-solid fa-lock"></i>
            <input type="password" id="password" placeholder="Password" required>
         </div>
         <button type="submit" class="btn-primary" id="btnLogin">
            <i class="fa-solid fa-right-to-bracket"></i> Login
         </button>
      </form>

      <!-- OTP STEP (hidden) -->
      <div id="otpStep" class="hidden">
         <p class="otp-info">Kode OTP dikirim ke email owner</p>
         <div class="otp-inputs">
            <input maxlength="1" inputmode="numeric">
            <input maxlength="1" inputmode="numeric">
            <input maxlength="1" inputmode="numeric">
            <input maxlength="1" inputmode="numeric">
            <input maxlength="1" inputmode="numeric">
            <input maxlength="1" inputmode="numeric">
         </div>
         <button class="btn-primary" id="btnVerifyOtp">Verifikasi OTP</button>
         <button class="btn-ghost" id="btnResend">Kirim Ulang OTP</button>
      </div>

      <div class="login-footer">
         <span>© 2026 BXF TOLS SHOP</span>
      </div>
   </div>
</div>

<!-- ROBOT AI -->
<div id="robot" class="robot-fly">
   <div class="robot-head">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="mouth"></div>
   </div>
   <div class="robot-body"></div>
</div>

<script src="js/robot.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
